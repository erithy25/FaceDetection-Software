[project]
name = "silentwitness"
version = "1.0.0"
description = "AI-Powered Deepfake Detection for Live Video"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "onnxruntime>=1.17.0",
    "onnx>=1.15.0",
    "mediapipe>=0.10.9",
    "opencv-python>=4.9.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "Pillow>=10.2.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
